[package]
name = "qqplayer-desktop"
version = "1.1.0"
description = "QQPlayer desktop shell (Tauri 2, Windows/Linux)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
