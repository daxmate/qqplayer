# QQPlayer iOS 壳（xcodegen 工程定义，唯一工程真源）
# 用法：build.sh（前端构建 → 复制 www → xcodegen generate → xcodebuild）
# 工程文件 QQPlayer.xcodeproj 不入库（.gitignore 排除），由 xcodegen 生成。
name: QQPlayer
options:
  bundleIdPrefix: com.daxmate.qqplayer
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
targets:
  QQPlayer:
    type: application
    platform: iOS
    sources:
      - Sources
      # 前端 bundle（build.sh 复制 dist → Resources/www；顶层 resources: 键在 xcodegen 2.46
      # 实测被静默忽略，改 sources + buildPhase: resources + type: folder → 蓝色文件夹引用，
      # bundle 内保留 www/ 结构）
      - path: Resources/www
        type: folder
        buildPhase: resources
      # App 图标（Assets.xcassets/AppIcon.appiconset，脚本由 desktop/macOS/assets/icon.icns 生成）
      - path: Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: QQPlayer
        CFBundleDevelopmentRegion: zh_CN
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 局域网访问桌面端（mDNS 发现 + HTTP 配对/流媒体）
        NSLocalNetworkUsageDescription: QQPlayer 需要访问局域网以发现并连接你的桌面端音乐服务器（配对、播放、同步）。
        NSBonjourServices:
          - _qqplayer._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
        # 后台播放（锁屏/息屏继续播）
        UIBackgroundModes:
          - audio
        UIApplicationSupportsIndirectInputEvents: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daxmate.qqplayer.ios
        PRODUCT_NAME: QQPlayer
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
        # 真机签名：写死开发者 team（zhangchaont@live.com，Apple Developer Program 会员），
        # xcodegen 重新生成工程后无需在 Xcode 重选。
        # 不设 CODE_SIGN_IDENTITY：Automatic 自动选 Apple Development（设 "-" 会强制 ad-hoc，
        # 真机带 entitlements 构建失败；模拟器构建由 build.sh 的 CODE_SIGNING_ALLOWED=NO 免签名）
        DEVELOPMENT_TEAM: B6FA37AYT5
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        SWIFT_EMIT_LOC_STRINGS: NO
    scheme:
      gatherCoverageData: false
      # 单元测试（QQPlayerTests，xcodegen 生成 scheme 的 Test action；
      # `xcodebuild test -scheme QQPlayer` 会跑测试）
      testTargets:
        - QQPlayerTests

  # iOS 壳单元测试 target（XCTest，覆盖抽出的纯逻辑：内嵌封面提取 /
  # 中断恢复状态机 / 封面策略决策；宿主 App = QQPlayer，@testable import 访问 internal 符号）
  QQPlayerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: QQPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daxmate.qqplayer.ios.tests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
