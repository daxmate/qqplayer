# QQPlayer Swift lint 配置（保守：禁用结构性/命名类规则，只保留纯质量问题检查）
# 代码里大量单字母变量（闭包参数 t/g/v 等）是既有风格，不动；force_cast/force_try
# 在 dict_events.swift / test 里是刻意用法（JSON 序列化），禁用避免误报。

included:
  - desktop/macOS
  - mobile/ios/Sources

excluded:
  - desktop/macOS/build
  - mobile/ios/build
  - mobile/ios/QQPlayer.xcodeproj

disabled_rules:
  # 结构性（不重构代码，避免大改）
  - type_body_length
  - function_body_length
  - file_length
  - cyclomatic_complexity
  - line_length
  # 命名（既有短变量风格）
  - identifier_name
  - type_name
  # 强制解包类（dict_events 序列化刻意使用）
  - force_try
  - force_cast
  - force_unwrapping
  # 与 .swiftformat 的 trailingCommas 规则冲突（多行 collection 保留尾逗号）
  - trailing_comma

opt_in_rules:
  - empty_count
  - empty_string
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - first_where
  - last_where
  - sorted_first_last
