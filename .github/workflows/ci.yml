name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 手动触发：不发版（不打 tag）时也能手动跑打包 job（workflow_dispatch 时打包 job 的 if 放行）
  workflow_dispatch:

jobs:
  version-check:
    name: Version consistency check
    # 版本号唯一真源 = 仓库根 VERSION 文件；所有构建配置里的版本号必须与它一致，
    # 防止手改漏掉（tauri.conf.json / Cargo.toml / Cargo.lock / package.json / package-lock.json / frontend）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check version consistency
        run: python3 scripts/check-version.py

  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install system deps (liblzo2-dev for python-lzo, used by readmdict)
        # apt 在 runner 上偶发挂起（曾多次卡 20+ 分钟）：加 timeout-minutes 快速失败 + 传输超时/重试
        # azure.archive.ubuntu.com 在 runner 上持续 Ign（连不上），archive.ubuntu.com 可达。
        # 注意：ubuntu-24.04 runner 用 /etc/apt/apt-mirrors.txt mirrorlist 选源（sources 里 URIs 是 mirror+file:...），
        # 只改 sources 文件无效——必须把 mirrorlist 里的 azure 也换掉（sed 保留原 scheme）
        timeout-minutes: 3
        run: |
          sudo sed -i 's|//azure.archive.ubuntu.com|//archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -y liblzo2-dev
      - name: Install deps
        run: pip install -r backend/requirements.txt
      - name: Lint (ruff check)
        run: cd backend && ruff check .
      - name: Format (ruff format)
        run: cd backend && ruff format --check .
      - name: Test (pytest)
        run: cd backend && pytest

  frontend:
    name: Frontend (eslint + prettier + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Lint (eslint)
        run: pnpm exec eslint .
      - name: Format (prettier)
        run: pnpm exec prettier --check .
      - name: Test (vitest)
        run: pnpm vitest run
      - name: Build
        run: pnpm build

  swift:
    name: Swift (swiftlint + swiftformat)
    # Swift 代码（desktop/macOS 壳 + mobile/ios 壳）lint/format 检查；
    # 与前端 job 平级，日常 push main / PR 都会跑（无 if 限制）。
    # 配置在仓库根 .swiftlint.yml / .swiftformat，swiftlint/swiftformat 自动发现。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: brew install swiftlint swiftformat
      - name: Lint (swiftlint)
        run: swiftlint lint
      - name: Format (swiftformat --lint)
        run: swiftformat --lint .

  backend-windows:
    name: Backend Windows ${{ matrix.arch }} (PyInstaller + smoke)
    # 只在发版（push tag v*）或手动触发时打包；日常 push main 只跑 lint/test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    # 双架构：x64（windows-latest）+ ARM64（windows-11-arm，GA 标准 runner）。
    # fail-fast: false —— ARM64 失败不取消 x64（python-lzo 等原生依赖在 arm64 可能更早暴露问题，先保 x64）
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-latest
            pyarch: x64
            # static-md：把 lzo 静态编进 lzo.pyd，无 lzo2.dll 分发（动态版 dll 不会被 PyInstaller 收集，
            # 运行时 import lzo 报 DLL load failed）；/MD 与 Python 扩展 CRT 匹配
            triplet: x64-windows-static-md
          - arch: arm64
            os: windows-11-arm
            pyarch: ARM64
            triplet: arm64-windows-static-md
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: ${{ matrix.pyarch }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      # python-lzo 只发 sdist（无 Windows wheel），且 setup.py 在 win32 上要求
      # LZO_DIR 指向含 include/lzo/ 头文件 + lzo2.lib（或 lzo.lib）的目录，否则直接 raise。
      # runner 不自带 LZO → 用 vcpkg 装（static-md，静态库避免 DLL 分发）并整理成
      # setup.py 期望的布局（LZO_DIR 根下直接放 lib）。
      - name: Install LZO (python-lzo 编译依赖)
        shell: pwsh
        run: |
          vcpkg install lzo:${{ matrix.triplet }}
          $inst = "$env:VCPKG_INSTALLATION_ROOT\installed\${{ matrix.triplet }}"
          if (-not (Test-Path $inst)) { $inst = "C:\vcpkg\installed\${{ matrix.triplet }}" }
          $layout = Join-Path $inst "lzo-setup"
          New-Item -ItemType Directory -Force (Join-Path $layout "include") | Out-Null
          Copy-Item -Recurse (Join-Path $inst "include\*") (Join-Path $layout "include\") -Force
          $libs = Get-ChildItem (Join-Path $inst "lib\*.lib") -ErrorAction SilentlyContinue | Where-Object { $_.Name -match 'lzo' }
          foreach ($lib in $libs) { Copy-Item $lib.FullName (Join-Path $layout $lib.Name) -Force }
          if ($libs) {
            # setup.py 优先找 lzo2.lib，其次 lzo.lib；两者都保证存在
            $chosen = $libs | Where-Object { $_.Name -in @('lzo2.lib','lzo.lib') } | Select-Object -First 1
            if (-not $chosen) { $chosen = $libs | Select-Object -First 1 }
            Copy-Item $chosen.FullName (Join-Path $layout "lzo2.lib") -Force
            Copy-Item $chosen.FullName (Join-Path $layout "lzo.lib") -Force
          }
          "LZO_DIR=$layout" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install deps
        run: pip install -r backend/requirements.txt pyinstaller
      - name: Build frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm build
      - name: PyInstaller package
        run: python -m PyInstaller --noconfirm --clean --distpath packaging/dist --workpath packaging/build packaging/qqplayer-backend.spec
      - name: Smoke test
        run: python packaging/win-smoke.py
      - name: Zip artifact
        run: Compress-Archive -Path packaging/dist/qqplayer-backend -DestinationPath packaging/dist/qqplayer-backend-win-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: qqplayer-backend-win-${{ matrix.arch }}
          path: packaging/dist/qqplayer-backend-win-${{ matrix.arch }}.zip

  backend-linux:
    name: Backend Linux x64 (PyInstaller + smoke)
    # 只在发版（push tag v*）或手动触发时打包；日常 push main 只跑 lint/test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install system deps (liblzo2-dev for python-lzo, used by readmdict)
        # apt 在 runner 上偶发挂起（曾多次卡 20+ 分钟）：加 timeout-minutes 快速失败 + 传输超时/重试
        # azure.archive.ubuntu.com 在 runner 上持续 Ign（连不上），archive.ubuntu.com 可达。
        # 注意：ubuntu-24.04 runner 用 /etc/apt/apt-mirrors.txt mirrorlist 选源（sources 里 URIs 是 mirror+file:...），
        # 只改 sources 文件无效——必须把 mirrorlist 里的 azure 也换掉（sed 保留原 scheme）
        timeout-minutes: 3
        run: |
          sudo sed -i 's|//azure.archive.ubuntu.com|//archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -y liblzo2-dev zip
      - name: Install deps
        run: pip install -r backend/requirements.txt pyinstaller
      - name: Build frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm build
      - name: PyInstaller package
        run: python -m PyInstaller --noconfirm --clean --distpath packaging/dist --workpath packaging/build packaging/qqplayer-backend.spec
      - name: Smoke test
        run: python packaging/win-smoke.py
      - name: Zip artifact
        run: cd packaging/dist && zip -r qqplayer-backend-linux-x64.zip qqplayer-backend
      - uses: actions/upload-artifact@v4
        with:
          name: qqplayer-backend-linux-x64
          path: packaging/dist/qqplayer-backend-linux-x64.zip

  tauri-windows:
    name: Tauri Shell Windows ${{ matrix.arch }} (build + smoke)
    # 只在发版（push tag v*）或手动触发时打包；日常 push main 只跑 lint/test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    # Windows 壳：x64（windows-latest）+ ARM64（windows-11-arm）。
    # 需要 backend-windows 的 zip 产物（内置后端集成进壳），所以 needs 它。
    # fail-fast: false —— arm64 失败不取消 x64（arm64 NSIS 等可能暴露新问题，先保 x64 可验收）
    needs: [backend-windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
          - arch: arm64
            os: windows-11-arm
            rust-target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      # rsproxy 是本机（国内网络）用的镜像；GitHub runner 在美国，直连 crates.io 更快
      # （实测 rsproxy 在 runner 上下载依赖 30s 传 0 字节超时）。CI 一律用默认 crates.io。
      - name: 移除 rsproxy 镜像（CI 直连 crates.io）
        shell: pwsh
        run: Remove-Item -Force desktop/Windows/src-tauri/.cargo/config.toml
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/Windows/src-tauri
      # 前端 dist 不跨 job 共享，tauri job 自己构建（frontendDist 指向仓库根 dist/）
      - name: Install frontend deps + build
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm build
      - uses: actions/download-artifact@v4
        with:
          name: qqplayer-backend-win-${{ matrix.arch }}
          path: packaging/dist
      # 解压内置后端 → src-tauri/resources/backend/（bundle.resources "resources/backend/**" 打包进安装目录 resources/backend/；
      # 注意 zip 内是 qqplayer-backend/ 目录，需移动到 backend/ 才能匹配 glob）
      - name: 集成内置后端
        shell: pwsh
        run: |
          Expand-Archive -Path packaging/dist/qqplayer-backend-win-${{ matrix.arch }}.zip -DestinationPath "$env:RUNNER_TEMP\qqp-backend" -Force
          $dst = "desktop/Windows/src-tauri/resources/backend"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item -Recurse "$env:RUNNER_TEMP\qqp-backend\qqplayer-backend\*" $dst -Force
          Get-ChildItem $dst | Select-Object -First 6 Name
      - name: Tauri build (NSIS)
        working-directory: desktop/Windows
        run: pnpm tauri build --target ${{ matrix.rust-target }} --bundles nsis
      # 冒烟：起壳 → 壳 spawn 内置后端 → 轮询 /api/settings 200（杀进程树收尾）
      # 注意：release 目录下的裸 exe 旁边没有内置后端（集成在 src-tauri/resources/backend/，
      # 打包时才进安装目录）→ 先拷到 exe 同目录 backend/（BackendLauncher 候选 1）模拟打包布局
      # 语法兜底：ps1 改动后先做秒级解析检查，语法/编码错误立即红，不拖到冒烟 15 分钟才发现
      - name: PowerShell syntax check (smoke script)
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "packaging/win-smoke-shell.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error ("{0} (line {1})" -f $_.Message, $_.Extent.StartLineNumber) }
            exit 1
          }
          Write-Output "PS1 syntax OK"
      - name: Smoke test
        shell: pwsh
        run: |
          $rel = "desktop/Windows/src-tauri/target/${{ matrix.rust-target }}/release"
          Copy-Item -Recurse "desktop/Windows/src-tauri/resources/backend" $rel -Force
          powershell -ExecutionPolicy Bypass -File packaging/win-smoke-shell.ps1 -ExePath "$rel/qqplayer-desktop.exe"
      # 便携版 zip（exe + resources；WebView2 用系统 runtime，无 WebView2Loader.dll——Tauri 2 默认
      # downloadBootstrapper 模式不生成它，存在才打包，容错）
      - name: 便携 zip
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION).Trim()
          $rel = "desktop/Windows/src-tauri/target/${{ matrix.rust-target }}/release"
          Get-ChildItem $rel | Select-Object Name | Format-Table -HideTableHeaders | Out-String | Write-Output
          $items = @("$rel\qqplayer-desktop.exe", "$rel\resources")
          if (Test-Path "$rel\WebView2Loader.dll") { $items += "$rel\WebView2Loader.dll" }
          Compress-Archive -Path $items -DestinationPath "QQPlayer_${ver}_${{ matrix.arch }}-portable.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: qqplayer-shell-win-${{ matrix.arch }}
          path: |
            desktop/Windows/src-tauri/target/${{ matrix.rust-target }}/release/bundle/nsis/*.exe
            QQPlayer_*_${{ matrix.arch }}-portable.zip

  tauri-linux:
    name: Tauri Shell Linux (build deb/AppImage + smoke)
    # 只在发版（push tag v*）或手动触发时打包；日常 push main 只跑 lint/test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    # Linux 壳：ubuntu-latest（x86_64）。真打包 deb + AppImage，集成内置后端后 xvfb 无头冒烟。
    # 需要 backend-linux 的 zip 产物（内置后端集成进壳），所以 needs 它。
    needs: [backend-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      # rsproxy 是本机（国内网络）用的镜像；GitHub runner 在美国，直连 crates.io 更快
      # （实测 rsproxy 在 runner 上下载依赖 30s 传 0 字节超时）。CI 一律用默认 crates.io。
      - name: 移除 rsproxy 镜像（CI 直连 crates.io）
        run: rm -f desktop/Windows/src-tauri/.cargo/config.toml
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/Windows/src-tauri
      - name: Install system deps (webkit2gtk 等 Tauri Linux 依赖)
        # 官方清单（v2.tauri.app/start/prerequisites）：libayatana-appindicator3-dev 是 tauri 2 需要的
        # （libappindicator3-dev 旧版会链接失败）；build-essential/libssl-dev 补全编译链。
        # apt 在 runner 上偶发挂起（曾多次卡 20+ 分钟）：照抄 backend job 的 sed 换源 + timeout-minutes
        # + Acquire 超时/重试；webkit2gtk 等大包安装放宽到 10min。
        # azure.archive.ubuntu.com 在 runner 上持续 Ign（连不上），archive.ubuntu.com 可达。
        # 注意：ubuntu-24.04 runner 用 /etc/apt/apt-mirrors.txt mirrorlist 选源（sources 里 URIs 是 mirror+file:...），
        # 只改 sources 文件无效——必须把 mirrorlist 里的 azure 也换掉（sed 保留原 scheme）
        timeout-minutes: 10
        run: |
          sudo sed -i 's|//azure.archive.ubuntu.com|//archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils xvfb dbus-x11
      - name: Install frontend deps + build
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm build
      - uses: actions/download-artifact@v4
        with:
          name: qqplayer-backend-linux-x64
          path: packaging/dist
      # 解压内置后端 → src-tauri/resources/backend/（bundle.resources "resources/backend/**" 打包进安装目录 resources/backend/；
      # 注意 zip 内是 qqplayer-backend/ 目录，需把内容拷进 backend/ 才能匹配 glob）
      - name: 集成内置后端
        run: |
          mkdir -p "$RUNNER_TEMP/qqp-backend"
          unzip -q -o packaging/dist/qqplayer-backend-linux-x64.zip -d "$RUNNER_TEMP/qqp-backend"
          mkdir -p desktop/Windows/src-tauri/resources/backend
          cp -r "$RUNNER_TEMP/qqp-backend/qqplayer-backend/." desktop/Windows/src-tauri/resources/backend/
          ls desktop/Windows/src-tauri/resources/backend | head -6
      - name: Tauri build (deb + AppImage)
        working-directory: desktop/Windows
        run: pnpm tauri build --bundles deb,appimage
      # 冒烟：起壳 → 壳 spawn 内置后端 → 轮询 /api/settings 200（收尾杀壳 + pkill 兜底）。
      # 注意：release 目录下的裸二进制旁边没有内置后端（集成在 src-tauri/resources/backend/，
      # 打包时才进安装目录）→ 先拷到 exe 同目录 backend/（BackendLauncher 候选 1）模拟打包布局。
      # 无头环境：xvfb-run + dbus-run-session 起壳，WebKitGTK 防 GPU 崩溃环境变量在脚本内设置。
      - name: Smoke test
        run: |
          rel="desktop/Windows/src-tauri/target/release"
          cp -r desktop/Windows/src-tauri/resources/backend "$rel"
          bash packaging/linux-smoke.sh "$rel/qqplayer-desktop"
      - uses: actions/upload-artifact@v4
        with:
          name: qqplayer-shell-linux-x64
          path: |
            desktop/Windows/src-tauri/target/release/bundle/deb/*.deb
            desktop/Windows/src-tauri/target/release/bundle/appimage/*.AppImage

  backend-macos:
    # 只在发版（push tag v*）或手动触发时打包；日常 push main 只跑 lint/test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    # macOS 后端 + 壳 + dmg 全量打包（双架构）：arm64（macos-15）+ x86_64（macos-15-intel，Intel runner）。
    # 与本地打包链路一致：standalone python（控制 deployment target 11.0，Homebrew python 会带打包机系统版本）→
    # PyInstaller → Swift 壳（build.sh ARCH 参数）→ hdiutil dmg → 冒烟 + 架构验证。
    # 版本：macos-13 (Intel) 已退役（2025-12），Intel 用 macos-15-intel（可用到 2027 秋）。
    # standalone python 版本固定 3.14.7+20260805（与本地 packenv 一致，升级需两处同步）。
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            pyarch: aarch64
            os: macos-15
          - arch: x86_64
            pyarch: x86_64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend deps + build
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Download standalone python ${{ matrix.pyarch }}
        run: |
          curl -fL --retry 3 -o /tmp/cpython.tar.gz "https://github.com/astral-sh/python-build-standalone/releases/download/20260805/cpython-3.14.7+20260805-${{ matrix.pyarch }}-apple-darwin-install_only.tar.gz"
          mkdir -p /tmp/cpython && tar -xzf /tmp/cpython.tar.gz -C /tmp/cpython --strip-components=1
          /tmp/cpython/bin/python3 -c "import platform; print('python arch:', platform.machine())"
      - name: Create venv
        run: /tmp/cpython/bin/python3 -m venv /tmp/venv
      # python-lzo 只发 sdist，需要 lzo 头文件 + 库（runner 自带 brew，Intel runner 前缀 /usr/local，arm64 为 /opt/homebrew）
      - name: Install LZO (python-lzo 编译依赖)
        run: |
          brew install lzo
          echo "LZO_PREFIX=$(brew --prefix lzo)" >> "$GITHUB_ENV"
      - name: Install deps
        run: |
          CPPFLAGS="-I$LZO_PREFIX/include" LDFLAGS="-L$LZO_PREFIX/lib" \
            /tmp/venv/bin/pip install -r backend/requirements.txt pyinstaller
      - name: PyInstaller package
        run: /tmp/venv/bin/python -m PyInstaller --noconfirm --clean --distpath packaging/dist --workpath packaging/build packaging/qqplayer-backend.spec
      - name: Smoke test (backend)
        run: |
          QQPLAYER_PORT=17630 QQPLAYER_DATA_DIR=/tmp/qqp-ci-smoke packaging/dist/qqplayer-backend/qqplayer-backend &
          BPID=$!
          ok=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:17630/api/settings > /dev/null; then ok=1; break; fi
            sleep 1
          done
          kill $BPID 2>/dev/null || true
          [ "$ok" = 1 ] || { echo "✗ 后端冒烟失败"; exit 1; }
          echo "✓ 后端冒烟 OK (port 17630)"
      - name: Shell build (ARCH=${{ matrix.arch }})
        working-directory: desktop/macOS
        run: ARCH=${{ matrix.arch }} BACKEND_SRC=packaging/dist/qqplayer-backend ./build.sh
      - name: Make dmg
        run: ARCH=${{ matrix.arch }} BACKEND_DIR=packaging/dist/qqplayer-backend ./packaging/make-dmg.sh "$(cat VERSION)"
      - name: Verify dmg (mount + arch check)
        run: |
          DMG=$(ls packaging/QQPlayer-*.dmg | head -1)
          hdiutil attach -mountpoint /tmp/qqp-dmg-mnt "$DMG"
          file /tmp/qqp-dmg-mnt/QQPlayer.app/Contents/MacOS/QQPlayer
          file /tmp/qqp-dmg-mnt/QQPlayer.app/Contents/Resources/backend/qqplayer-backend
          hdiutil detach /tmp/qqp-dmg-mnt
      - uses: actions/upload-artifact@v4
        with:
          name: qqplayer-macos-${{ matrix.arch }}
          path: packaging/QQPlayer-*.dmg
