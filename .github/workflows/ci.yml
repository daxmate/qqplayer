name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install system deps (liblzo2-dev for python-lzo, used by readmdict)
        # apt 在 runner 上偶发挂起（曾多次卡 20+ 分钟）：加 timeout-minutes 快速失败 + 传输超时/重试
        # azure.archive.ubuntu.com 在 runner 上持续 Ign（连不上），archive.ubuntu.com 可达——先把源替换掉再 update
        timeout-minutes: 3
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -y liblzo2-dev
      - name: Install deps
        run: pip install -r backend/requirements.txt
      - name: Lint (ruff check)
        run: cd backend && ruff check .
      - name: Format (ruff format)
        run: cd backend && ruff format --check .
      - name: Test (pytest)
        run: cd backend && pytest

  frontend:
    name: Frontend (eslint + prettier + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Lint (eslint)
        run: pnpm exec eslint .
      - name: Format (prettier)
        run: pnpm exec prettier --check .
      - name: Test (vitest)
        run: pnpm vitest run
      - name: Build
        run: pnpm build
