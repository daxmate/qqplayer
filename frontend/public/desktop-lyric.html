<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>桌面歌词</title>
    <style>
      /* 透明背景：窗口由 Swift 壳负责透明，页面只画文字 */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
        height: 100%;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, "PingFang SC", "Hiragino Sans", "Noto Sans SC", sans-serif;
        padding: 18px 24px;
        text-align: center;
      }
      /* 字体（设置写入 body 内联） */
      body.font-serif {
        font-family: "Songti SC", "SimSun", "Noto Serif SC", serif;
      }
      body.font-rounded {
        font-family: "Yuanti SC", "PingFang SC", "Noto Sans SC", sans-serif;
      }
      body.align-left {
        align-items: flex-start;
        text-align: left;
      }
      body.align-right {
        align-items: flex-end;
        text-align: right;
      }
      /* 双行：日文主行 + 中文翻译行；无翻译时只显示主行 */
      .line-jp {
        font-size: 26px;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.95);
        line-height: 1.45;
        text-shadow:
          0 1px 3px rgba(0, 0, 0, 0.8),
          0 0 12px rgba(0, 0, 0, 0.35);
        transition: opacity 0.2s;
      }
      .line-zh {
        margin-top: 6px;
        font-size: 16px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.72);
        line-height: 1.4;
        text-shadow:
          0 1px 3px rgba(0, 0, 0, 0.8),
          0 0 10px rgba(0, 0, 0, 0.3);
      }
      /* 无歌词/未播放状态 */
      .idle {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.45);
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      }
      /* 切换动画：旧行淡出新行淡入 */
      .fade-in {
        animation: fadeIn 0.25s ease-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div id="jp" class="line-jp"></div>
    <div id="zh" class="line-zh"></div>
    <script>
      // ============ 统一壳桥（内联：public/ 静态文件不走 Vite 打包，不能 import composable） ============
      // Tauri 2（Windows 壳）→ invoke('report')；WebKit（macOS 壳）→ postMessage；浏览器预览 → 静默 noop
      const bridge = window.__TAURI_INTERNALS__
        ? {
            report: (m) => window.__TAURI__.core.invoke("report", { msg: m }).catch(() => {}),
          }
        : { report: (m) => window.webkit?.messageHandlers?.native?.postMessage?.(m) };
      // 桌面歌词悬浮窗页面
      // 轮询后端 /api/now-playing 拿 {path, lineIndex}；歌词全文拉一次缓存，切歌重拉
      // 设置走后端统一 GET /api/settings 的 desktopLyric namespace（主播放器与悬浮窗跨引擎共享）：{ showZh, ... }
      const $jp = document.getElementById("jp");
      const $zh = document.getElementById("zh");

      let lyric = []; // 当前歌的 line 列表（含原文/翻译）
      let currentPath = null;
      let lastLine = -1;
      let lastText = "";
      let cachedSettings = {}; // 后端拉取的设置（Vivaldi/WKWebView 跨引擎共享）
      let cachedAccent = "#ff7e5f"; // 主播放器强调色（跟随主题配色用，now-playing 携带）

      function settings() {
        return cachedSettings;
      }

      // 从后端拉桌面歌词设置（统一 GET /api/settings 取 desktopLyric namespace；含初始与轮询刷新；失败时保留旧值）
      async function refreshSettings() {
        try {
          const res = await fetch("/api/settings", { cache: "no-store" });
          if (!res.ok) return;
          const data = await res.json();
          const s = (data.settings || {}).desktopLyric || {};
          const changed =
            s.fontFamily !== cachedSettings.fontFamily ||
            s.align !== cachedSettings.align ||
            s.fontSize !== cachedSettings.fontSize ||
            s.zhSize !== cachedSettings.zhSize ||
            s.jpColor !== cachedSettings.jpColor ||
            s.zhColor !== cachedSettings.zhColor ||
            s.width !== cachedSettings.width ||
            s.height !== cachedSettings.height ||
            s.showZh !== cachedSettings.showZh;
          cachedSettings = s;
          if (changed) {
            applyStyle();
            lastText = ""; // 强制重绘（翻译开关变化）
            render(lastLine);
          }
        } catch {
          /* 忽略 */
        }
      }

      // 应用样式设置：字体/对齐/字号/颜色（字号渲染时直接设置）
      function applyStyle() {
        const s = settings();
        document.body.classList.toggle("font-serif", s.fontFamily === "serif");
        document.body.classList.toggle("font-rounded", s.fontFamily === "rounded");
        document.body.classList.toggle("align-left", s.align === "left");
        document.body.classList.toggle("align-right", s.align === "right");
        $jp.style.fontSize = (s.fontSize || 26) + "px";
        $zh.style.fontSize = (s.zhSize || 16) + "px";
        // 颜色：自定义优先 → 配色方案落地值 → 跟随主题用强调色
        const jp =
          s.jpColor || (s.colorScheme === "theme" ? cachedAccent : "rgba(255,255,255,0.95)");
        const zh =
          s.zhColor || (s.colorScheme === "theme" ? cachedAccent : "rgba(255,255,255,0.72)");
        $jp.style.color = jp;
        $zh.style.color = zh;
        applyWindowSize();
      }

      // 窗体大小：通过 WebKit 消息让 Swift 壳调整窗口（浏览器预览时静默失败）
      function applyWindowSize() {
        const s = settings();
        const w = s.width || 460;
        const h = s.height || 140;
        try {
          bridge.report({
            type: "resize",
            width: w,
            height: h,
          });
        } catch {
          /* 浏览器预览无 native handler，忽略 */
        }
      }

      // 拉歌词全文（line 列表）：成功返回 true，失败 false
      async function loadLyric(path) {
        try {
          const res = await fetch("/api/lyric?path=" + encodeURIComponent(path), {
            cache: "no-store",
          });
          if (!res.ok) throw new Error("lyric " + res.status);
          const data = await res.json();
          lyric = (data.lines || []).filter((l) => l.type === "line");
          return true;
        } catch {
          lyric = [];
          return false;
        }
      }

      // 渲染当前句；无变化不重绘（避免闪烁）
      function render(lineIndex) {
        const line = lyric[lineIndex];
        if (!line) {
          if (lastText !== "idle") {
            lastText = "idle";
            $jp.textContent = "";
            $zh.textContent = "";
          }
          return;
        }
        const jp = line.text?.[0] || "";
        const zh = (settings().showZh !== false ? line.text?.[2] : "") || "";
        const key = jp + "\u0000" + zh;
        if (key === lastText) return;
        lastText = key;
        $jp.textContent = jp;
        $zh.textContent = zh;
        $jp.className = "line-jp fade-in";
        $zh.className = zh ? "line-zh fade-in" : "line-zh";
      }

      // 空闲态提示（未播放/无歌）
      function showIdle() {
        if (lastText === "idle") return;
        lastText = "idle";
        $jp.textContent = "未在播放";
        $zh.textContent = "";
        $jp.className = "line-jp idle";
      }

      async function tick() {
        // 设置轮询（与播放状态同频 500ms，变化才重绘）
        refreshSettings();
        try {
          const res = await fetch("/api/now-playing", { cache: "no-store" });
          if (!res.ok) throw new Error("np " + res.status);
          const np = await res.json();
          // 强调色更新（跟随主题配色）；变化时重绘
          if (np.accent && np.accent !== cachedAccent) {
            cachedAccent = np.accent;
            applyStyle();
            lastText = "";
            render(lastLine);
          }
          if (!np.path) {
            showIdle();
            return;
          }
          if (np.path !== currentPath) {
            currentPath = np.path;
            lastLine = -1;
            lastText = "";
            const ok = await loadLyric(np.path);
            if (!ok) showIdle();
            else render(np.lineIndex);
            return;
          }
          if (np.lineIndex !== lastLine) {
            lastLine = np.lineIndex;
            render(np.lineIndex);
          }
        } catch {
          showIdle();
        }
      }

      // 启动立即查一次（设置+播放状态），然后 500ms 轮询
      tick();
      setInterval(tick, 500);
    </script>
  </body>
</html>
